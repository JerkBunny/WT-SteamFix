name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build exe
        shell: pwsh
        run: ./build/Build-Exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WT-SteamFix
          path: |
            dist/WT-SteamFix.exe
            dist/使用说明.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WT-SteamFix.exe
            dist/使用说明.txt
